<svg font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200" role="img" aria-label="A timeline showing server A in charge, then a single handoff moment, then server B in charge, with the ticket number going from 7 to 8">
  <rect x="60" y="92" width="240" height="52" rx="6" fill="#1E6F5C" fill-opacity="0.18" stroke="#1E6F5C" stroke-opacity="0.7" stroke-width="1.5" />

  <rect x="300" y="92" width="240" height="52" rx="6" fill="#1E6F5C" fill-opacity="0.09" stroke="#1E6F5C" stroke-opacity="0.7" stroke-width="1.5" />

  <text x="180" y="124" text-anchor="middle" font-size="13" font-weight="600" fill="#E8EFEC">Server A is in charge</text>
  <text x="420" y="124" text-anchor="middle" font-size="13" font-weight="600" fill="#E8EFEC">Server B is in charge</text>

  <line x1="300" y1="62" x2="300" y2="168" stroke="#1E6F5C" stroke-width="2.5" stroke-dasharray="5 4" />

  <circle cx="300" cy="118" r="7" fill="#1E6F5C" />

  <text x="300" y="50" text-anchor="middle" font-size="12" font-weight="700" fill="#E8EFEC">one database write</text>
  <text x="300" y="32" text-anchor="middle" font-size="11" fill="#E8EFEC" fill-opacity="0.7">there is no in-between moment</text>

  <text x="180" y="166" text-anchor="middle" font-size="12" fill="#E8EFEC" fill-opacity="0.8">ticket number 7</text>
  <text x="420" y="166" text-anchor="middle" font-size="12" fill="#E8EFEC" fill-opacity="0.8">ticket number 8</text>
  <text x="300" y="192" text-anchor="middle" font-size="11" fill="#E8EFEC" fill-opacity="0.65">A can still be mid-save here, and every write it attempts is rejected</text>
</svg>
