<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" width="600" height="300" viewBox="0 0 600 300" fill="none">
<rect x="80" y="60" width="220" height="150" fill="#1E6F5C" fill-opacity="0.16"/>
<rect x="300" y="60" width="220" height="150" fill="#1E6F5C" fill-opacity="0.07"/>
<rect x="80" y="60" width="440" height="150" fill="none" stroke="#1E6F5C" stroke-opacity="0.9" stroke-width="2"/>
