<text x="300" y="252" text-anchor="middle" font-size="11.5" fill="#E8EFEC">spawn sits on the border, in region 1. Walk west and you cross.</text>
<text x="300" y="278" text-anchor="middle" font-size="10.5" fill="#9fb8b0">region-size 2048, regions-x 2, regions-z 1</text>
