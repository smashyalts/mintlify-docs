<text x="190" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#E8EFEC">Region 0</text>
<text x="190" y="142" text-anchor="middle" font-size="11" fill="#9fb8b0">world-r0</text>
<text x="190" y="160" text-anchor="middle" font-size="11" fill="#9fb8b0">x -2048 to 0</text>
